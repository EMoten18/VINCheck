<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>VINCheck</title><style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#111827}header{background:#111827;color:white;padding:18px}main{padding:14px;max-width:760px;margin:auto}.actions,.tabs{display:flex;gap:8px;margin-bottom:12px}button,label{flex:1;padding:13px;border:0;border-radius:12px;background:#111827;color:white;font-weight:700;text-align:center}.alt{background:white;color:#111827;border:1px solid #ddd}input[type=file]{display:none}.batch,details{background:white;border:1px solid #ddd;border-radius:14px;margin:10px 0;overflow:hidden}.head{padding:12px}.vehicle{display:flex;gap:10px;padding:11px;border-top:1px solid #eee}.vehicle.done{opacity:.45;text-decoration:line-through}.vin{font-family:monospace;font-weight:800}.meta{font-size:12px;color:#666;margin-top:4px}.date{font-size:18px;font-weight:800;margin-top:20px}.empty{text-align:center;color:#777;padding:40px}.scan{background:#fff7d6;padding:10px;border-radius:10px;display:none}.overdue{color:#b42318;font-weight:800}select{padding:7px;border-radius:8px}
</style></head><body><header><b style="font-size:22px">VINCheck ✓</b><div style="font-size:12px;opacity:.7">Photo → checklist → archive</div></header><main>
<div class="actions"><label for="cam">📷 Take Photos</label><label class="alt" for="pick">🖼 Choose Photos</label></div><input id="cam" type="file" accept="image/*" capture="environment" multiple><input id="pick" type="file" accept="image/*" multiple>
<div id="scan" class="scan"></div><div class="tabs"><button id="ta">Active</button><button id="th" class="alt">History</button></div><div id="active"></div><div id="history" style="display:none"></div></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=s=>document.querySelector(s),K='vincheck_v2';let db=JSON.parse(localStorage.getItem(K)||'{"active":[],"history":[]}');const save=()=>localStorage.setItem(K,JSON.stringify(db));
const fd=t=>new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),ft=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
function extract(text){let L=text.split(/\n/).map(x=>x.trim()).filter(Boolean),o=[];for(let i=0;i<L.length;i++){let c=L[i].toUpperCase().replace(/[^A-Z0-9]/g,''),vs=c.match(/[A-HJ-NPR-Z0-9]{17}/g)||[];for(let vin of vs){let w=L.slice(Math.max(0,i-2),i+7).join(' '),row=(w.match(/(?:ROW\s*\/?\s*BAY|ROW|BAY)\s*[:#-]?\s*(\d{2,4})\b/i)||[])[1]||'',status=(w.match(/(OVERDUE[^\n]{0,18}|NEEDS\s*INSPECT(?:ED|ION)?[^\n]{0,18})/i)||[])[1]||'',until=(w.match(/UNTIL\s*24H\s*[:\-]?\s*(\d+\s*h\s*\d*\s*m|\d+\s*m)/i)||[])[1]||'';o.push({vin,row,status,until,done:false})}}return o}
async function scan(files){if(!files.length)return;$('#scan').style.display='block';let all=[];for(let i=0;i<files.length;i++){ $('#scan').textContent=`Reading photo ${i+1} of ${files.length}…`;try{let r=await Tesseract.recognize(files[i],'eng');all.push(...extract(r.data.text))}catch(e){}}let s=new Set(),v=all.filter(x=>x.vin&&!s.has(x.vin)&&s.add(x.vin));if(v.length){db.active.push({id:Date.now(),created:Date.now(),sort:'original',vehicles:v});save();renderA();$('#scan').textContent=`New checklist created: ${v.length} vehicles.`}else $('#scan').textContent='No VINs found. Try a clearer photo.';setTimeout(()=>$('#scan').style.display='none',2200)}
function sortv(b){let a=b.vehicles.map((v,i)=>({...v,i}));if(b.sort==='row')a.sort((x,y)=>(+x.row||9999)-(+y.row||9999));if(b.sort==='status')a.sort((x,y)=>(/overdue/i.test(y.status)?1:0)-(/overdue/i.test(x.status)?1:0));return a}
function renderA(){let e=$('#active');if(!db.active.length){e.innerHTML='<div class="empty"><b>No active checklists.</b><br>Take photos to create one.</div>';return}e.innerHTML=db.active.map((b,n)=>{let d=b.vehicles.filter(v=>v.done).length;return `<div class="batch"><div class="head"><b>Checklist ${n+1}</b><br><small>${b.vehicles.length} vehicles • ${d} complete • ${ft(b.created)}</small><br><select data-sort="${b.id}"><option value="original">Original order</option><option value="row" ${b.sort==='row'?'selected':''}>Row / Bay</option><option value="status" ${b.sort==='status'?'selected':''}>Status</option></select></div>${sortv(b).map(v=>`<div class="vehicle ${v.done?'done':''}"><input type="checkbox" data-b="${b.id}" data-i="${v.i}" ${v.done?'checked':''}><div><div class="vin">${v.vin}</div><div class="meta">${v.row?'Row / Bay: '+v.row+'<br>':''}<span class="${/overdue/i.test(v.status)?'overdue':''}">${v.status||''}</span>${v.until?'<br>Until 24h: '+v.until:''}</div></div></div>`).join('')}</div>`}).join('');document.querySelectorAll('[data-b]').forEach(c=>c.onchange=()=>{let b=db.active.find(x=>x.id==c.dataset.b);b.vehicles[+c.dataset.i].done=c.checked;if(b.vehicles.every(v=>v.done)){db.active=db.active.filter(x=>x.id!==b.id);b.completed=Date.now();db.history.push(b)}save();renderA();renderH()});document.querySelectorAll('[data-sort]').forEach(s=>s.onchange=()=>{let b=db.active.find(x=>x.id==s.dataset.sort);b.sort=s.value;save();renderA()})}
function renderH(){let h=[...db.history].sort((a,b)=>b.completed-a.completed),g={};h.forEach(b=>(g[fd(b.completed)]??=[]).push(b));$('#history').innerHTML=h.length?Object.entries(g).map(([d,bs])=>`<div class="date">${d}</div>${bs.map(b=>`<details><summary class="head">✓ ${b.vehicles.length} vehicles • completed ${ft(b.completed)}</summary>${b.vehicles.map(v=>`<div class="vehicle"><div><div class="vin">${v.vin}</div><div class="meta">${v.row?'Row '+v.row:''}</div></div></div>`).join('')}</details>`).join('')}`).join(''):'<div class="empty">Completed checklists will appear here.</div>'}
$('#cam').onchange=e=>scan([...e.target.files]);$('#pick').onchange=e=>scan([...e.target.files]);$('#ta').onclick=()=>{$('#active').style.display='block';$('#history').style.display='none'};$('#th').onclick=()=>{$('#active').style.display='none';$('#history').style.display='block';renderH()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');renderA();renderH();
</script></body></html>
