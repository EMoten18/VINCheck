<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>VINCheck V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:3}.title{font-size:22px;font-weight:800}.ver{font-size:11px;opacity:.65}
main{max-width:760px;margin:auto;padding:14px 14px 90px}.actions,.tabs{display:flex;gap:8px;margin-bottom:12px}
button,label.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font-weight:750;font-size:15px;text-align:center;background:#111827;color:#fff}.light{background:#fff!important;color:#111827!important;border:1px solid #ddd!important}
input[type=file]{display:none}.tabs button.on{background:#111827;color:#fff}.tabs button:not(.on){background:#fff;color:#111827;border:1px solid #ddd}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.count{font-size:13px;color:#6b7280}select{padding:9px;border:1px solid #ddd;border-radius:9px;background:#fff}
.card{display:grid;grid-template-columns:42px 1fr;background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:11px;margin:8px 0}.check{width:28px;height:28px}.vin{font-family:ui-monospace,Menlo,monospace;font-weight:850;font-size:15px;word-break:break-all}.meta{font-size:12px;color:#6b7280;line-height:1.5;margin-top:4px}.overdue{color:#b42318;font-weight:800}.date{font-size:18px;font-weight:850;margin:20px 2px 8px}.empty{text-align:center;color:#6b7280;padding:42px 15px}
.scan{display:none;background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:12px;margin:10px 0;font-size:13px}
.note{font-size:11px;color:#6b7280;margin-top:4px}
</style></head><body>
<header><div class="title">VINCheck ✓</div><div class="ver">Version 4</div></header><main>
<div class="actions"><label class="btn" for="cam">📷 Take Photos</label><label class="btn light" for="pick">🖼 Choose Photos</label></div>
<input id="cam" type="file" accept="image/*" capture="environment" multiple><input id="pick" type="file" accept="image/*" multiple>
<div id="scan" class="scan"></div>
<div class="tabs"><button id="aTab" class="on">Active</button><button id="cTab">Completed</button></div>
<div id="activePane"><div class="toolbar"><span id="acount" class="count"></span><select id="sort"><option value="original">Original order</option><option value="row">Row / Bay</option><option value="status">Status</option><option value="due">Until 24h</option></select></div><div id="active"></div></div>
<div id="completedPane" style="display:none"><div class="note">Uncheck any vehicle here to move it back to Active.</div><div id="completed"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=s=>document.querySelector(s),K='vincheck_v4';
let db=JSON.parse(localStorage.getItem(K)||'{"vehicles":[],"sort":"original","seq":0}');
const save=()=>localStorage.setItem(K,JSON.stringify(db));
function parseDuration(s){let h=+(s?.match(/(\d+)\s*h/i)||[0,0])[1],m=+(s?.match(/(\d+)\s*m/i)||[0,0])[1];return h*60+m}
function liveDue(v){if(!v.deadlineAt)return v.status||'';let d=v.deadlineAt-Date.now(),late=d<0,n=Math.abs(Math.ceil(d/60000)),h=Math.floor(n/60),m=n%60,txt=(h?h+'h ':'')+m+'m';return late?'OVERDUE · '+txt:txt+' remaining'}
function migrate(){
 if(db.vehicles.length)return;
 try{let v3=JSON.parse(localStorage.getItem('vincheck_v3')||'null');if(v3&&v3.vehicles){db=v3;db.vehicles.forEach(v=>{if(v.until&&!v.deadlineAt&&!v.done){let n=parseDuration(v.until);if(n)v.deadlineAt=Date.now()+n*60000}});save();return}}catch(e){}
 try{
  let old=JSON.parse(localStorage.getItem('vincheck_v2')||'null');
  if(old){
   [...(old.active||[]),...(old.history||[])].forEach(b=>(b.vehicles||[]).forEach(v=>{
    if(!db.vehicles.some(x=>x.vin===v.vin)){db.seq++;db.vehicles.push({...v,id:Date.now()+db.seq,order:db.seq,completedAt:v.done?(b.completed||Date.now()):null,importedAt:b.created||Date.now()})}
   })); save();
  }
 }catch(e){}
} migrate();
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fd=t=>new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
function mins(s){let h=+(s?.match(/(\d+)\s*h/i)||[0,0])[1],m=+(s?.match(/(\d+)\s*m/i)||[0,0])[1];return h*60+m}
function extract(text,importId){
 let L=text.split(/\n/).map(x=>x.trim()).filter(Boolean),o=[];
 for(let i=0;i<L.length;i++){
  let c=L[i].toUpperCase().replace(/[^A-Z0-9]/g,''),vins=c.match(/[A-HJ-NPR-Z0-9]{17}/g)||[];
  for(let vin of vins){
   let w=L.slice(Math.max(0,i-2),i+7).join(' ');
   let row=(w.match(/(?:ROW\s*\/?\s*BAY|ROW|BAY)\s*[:#-]?\s*(\d{2,4})\b/i)||[])[1]||'';
   let status=(w.match(/(OVERDUE\s*[·\-:]?\s*\d+\s*h(?:\s*\d+\s*m)?|NEEDS\s*INSPECT(?:ED|ION)?\s*[·\-:]?\s*\d+\s*h(?:\s*\d+\s*m)?)/i)||[])[1]||'';
   let until=(w.match(/(?:UNTIL\s*24H)\s*[:\-]?\s*(\d+\s*h\s*\d*\s*m|\d+\s*m)/i)||[])[1]||'';
   let dm=parseDuration(until);o.push({vin,row,status,until,deadlineAt:dm?Date.now()+dm*60000:null,done:false,completedAt:null,importedAt:Date.now(),importId});
  }
 }return o;
}
async function scan(files){
 if(!files.length)return;$('#scan').style.display='block';let all=[],importId=Date.now();
 for(let i=0;i<files.length;i++){ $('#scan').textContent=`Reading photo ${i+1} of ${files.length}…`;
  try{let r=await Tesseract.recognize(files[i],'eng');all.push(...extract(r.data.text,importId))}catch(e){}
 }
 let seen=new Set(),unique=all.filter(v=>v.vin&&!seen.has(v.vin)&&seen.add(v.vin));
 let added=0,dupes=0;unique.forEach(v=>{if(db.vehicles.some(x=>x.vin===v.vin&&!x.done)){dupes++;return}db.seq++;v.id=Date.now()+db.seq;v.order=db.seq;db.vehicles.push(v);added++});
 save();render();$('#scan').innerHTML=`Added <b>${added}</b> vehicle${added===1?'':'s'}${dupes?` • skipped ${dupes} active duplicate${dupes===1?'':'s'}`:''}.`;setTimeout(()=>$('#scan').style.display='none',2400);
}
function sortedActive(){
 let a=db.vehicles.filter(v=>!v.done); if(db.sort==='row')a.sort((x,y)=>(+x.row||99999)-(+y.row||99999)||x.order-y.order);
 if(db.sort==='status')a.sort((x,y)=>(/overdue/i.test(y.status)?1:0)-(/overdue/i.test(x.status)?1:0)||x.order-y.order);
 if(db.sort==='due')a.sort((x,y)=>(x.deadlineAt||Infinity)-(y.deadlineAt||Infinity)||x.order-y.order); return a;
}
function card(v,completed=false){return `<div class="card"><input class="check" type="checkbox" data-id="${v.id}" ${v.done?'checked':''}><div><div class="vin">${esc(v.vin)}</div><div class="meta">${v.row?`<b>Row / Bay:</b> ${esc(v.row)}<br>`:''}${!completed&&(v.deadlineAt||v.status)?`<span class="${/OVERDUE/i.test(liveDue(v))?'overdue':''}"><b>${esc(liveDue(v))}</b></span><br>`:''}${completed&&v.completedAt?`Completed ${new Date(v.completedAt).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`:''}</div></div></div>`}
function bind(){document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{let v=db.vehicles.find(x=>x.id==c.dataset.id);v.done=c.checked;v.completedAt=c.checked?Date.now():null;save();render()})}
function render(){
 let a=sortedActive();$('#acount').textContent=`${a.length} active vehicle${a.length===1?'':'s'}`;$('#sort').value=db.sort;$('#active').innerHTML=a.length?a.map(v=>card(v)).join(''):'<div class="empty"><b>Nothing active.</b><br>Take photos to add vehicles.</div>';
 let done=db.vehicles.filter(v=>v.done).sort((a,b)=>b.completedAt-a.completedAt),g={};done.forEach(v=>(g[fd(v.completedAt)]??=[]).push(v));
 $('#completed').innerHTML=done.length?Object.entries(g).map(([d,vs])=>`<div class="date">${d}</div>${vs.map(v=>card(v,true)).join('')}`).join(''):'<div class="empty">Checked vehicles will appear here.</div>';bind();
}
$('#sort').onchange=e=>{db.sort=e.target.value;save();render()};$('#cam').onchange=e=>{scan([...e.target.files]);e.target.value=''};$('#pick').onchange=e=>{scan([...e.target.files]);e.target.value=''};
$('#aTab').onclick=()=>{$('#activePane').style.display='block';$('#completedPane').style.display='none';$('#aTab').className='on';$('#cTab').className=''};
$('#cTab').onclick=()=>{$('#activePane').style.display='none';$('#completedPane').style.display='block';$('#cTab').className='on';$('#aTab').className=''};
setInterval(()=>{if($('#activePane').style.display!=='none')render()},30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
